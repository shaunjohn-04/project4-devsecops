apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: project4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.8
          ports:
            - containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: complaint_db
            - name: MARIADB_USER
              value: project4user
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: project4-db-secret
                  key: db-password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: project4-db-secret
                  key: db-root-password
          volumeMounts:
            - name: database-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: database-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: project4
spec:
  selector:
    app: mariadb
  ports:
    - port: 3306
      targetPort: 3306
